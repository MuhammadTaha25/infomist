<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="AI Automation Is Transforming Modern Business Workflows — Infomist Insights">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1324"/>
      <stop offset="0.55" stop-color="#0F1E3A"/>
      <stop offset="1" stop-color="#0B1324"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#84CC16"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M120 0V675M240 0V675M360 0V675M480 0V675M600 0V675M720 0V675M840 0V675M960 0V675M1080 0V675"/>
  </g>
  <ellipse cx="980" cy="150" rx="360" ry="300" fill="url(#glowR)"/>

  <!-- node-and-line motif, right side -->
  <g stroke="#0EA5E9" stroke-opacity="0.35" fill="#0EA5E9">
    <path d="M900 470 L1000 420 L1080 470 L1000 520 Z" fill="none"/>
    <path d="M1000 420 V520 M900 470 L1080 470"/>
    <circle cx="900" cy="470" r="5"/><circle cx="1080" cy="470" r="5"/>
    <circle cx="1000" cy="420" r="5" fill="#84CC16"/><circle cx="1000" cy="520" r="5"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(80 68)">
    <circle cx="22" cy="22" r="21" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="22" cy="13" r="3.4" fill="#0EA5E9"/>
    <path d="M22 20 V34" stroke="#84CC16" stroke-width="4" stroke-linecap="round"/>
    <text x="58" y="30" font-family="Inter, system-ui, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#ffffff">INFOMIST</text>
  </g>

  <rect x="80" y="196" width="56" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="80" y="246" font-family="Inter, system-ui, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="5" fill="#38BDF8">AI AUTOMATION</text>

  <text font-family="Inter, system-ui, Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff" letter-spacing="-1">
    <tspan x="80" y="360">AI Automation Is</tspan>
    <tspan x="80" y="436">Transforming Modern</tspan>
    <tspan x="80" y="512">Business Workflows</tspan>
  </text>

  <text x="80" y="600" font-family="Inter, system-ui, Arial, sans-serif" font-size="22" font-weight="600" fill="#94A3B8">infomist.com/insights</text>
</svg>
